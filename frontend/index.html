<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>The Us Space</title>
  <style>
    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    /* Midnight Starlight Dark Mode Adaptation */
    .theme-midnight header {
      background-color: rgba(19, 17, 28, 0.82) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
    }

    .theme-midnight h1,
    .theme-midnight h2,
    .theme-midnight h3,
    .theme-midnight h4,
    .theme-midnight .text-stone-800,
    .theme-midnight .text-stone-900 {
      color: #f5f3ff !important;
    }

    .theme-midnight .text-stone-700,
    .theme-midnight .text-stone-600 {
      color: #cbd5e1 !important;
    }

    .theme-midnight .text-stone-500 {
      color: #94a3b8 !important;
    }

    .theme-midnight .vault-surface,
    .theme-midnight .bg-white\/80,
    .theme-midnight .bg-white\/75,
    .theme-midnight .bg-white\/70,
    .theme-midnight .bg-white\/65,
    .theme-midnight .bg-white\/60,
    .theme-midnight .bg-white\/50 {
      background-color: rgba(30, 27, 46, 0.78) !important;
      border-color: rgba(255, 255, 255, 0.14) !important;
      color: #f1f5f9 !important;
    }

    .theme-midnight input[type="text"],
    .theme-midnight input[type="date"],
    .theme-midnight input[type="number"],
    .theme-midnight textarea,
    .theme-midnight select {
      background-color: rgba(15, 13, 24, 0.85) !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
      color: #f8fafc !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
